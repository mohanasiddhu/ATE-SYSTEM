# YOLOv8 Smart Traffic Dataset Configuration
# Structure complies with Ultralytics YOLOv8 / YOLO11 specification

path: ../datasets
train: train/images
val: val/images
test: test/images

# Number of classes
nc: 8

# Class names
names:
  0: car
  1: motorcycle
  2: bus
  3: truck
  4: auto_rickshaw
  5: bicycle
  6: license_plate
  7: rider_no_helmet

# Class weights for training loss balancing
class_weights:
  car: 1.0
  motorcycle: 1.2
  bus: 1.1
  truck: 1.1
  auto_rickshaw: 1.3
  bicycle: 1.4
  license_plate: 1.5
  rider_no_helmet: 1.8

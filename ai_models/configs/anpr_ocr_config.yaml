# ANPR OCR Recognition Configuration
model_type: "LPRNet_CRNN"
weights_path: "../ai_models/weights/lprnet_ocr.pth"
input_shape: [3, 24, 94]
characters: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
blank_label: 36
beam_width: 5
min_confidence: 0.88
regex_patterns:
  - "^[A-Z]{2}[0-9]{2}[A-Z]{1,2}[0-9]{4}$" # Standard Indian HSRP
  - "^[A-Z]{2}[0-9]{2}[0-9]{4}$"
  - "^[0-9]{2}BH[0-9]{4}[A-Z]{1,2}$"        # Bharat Series (BH)
preprocess:
  resize: [94, 24]
  grayscale: false
  clahe_clip_limit: 2.0
  blur_kernel: 3
